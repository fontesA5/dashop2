<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DaShop - Admin Sign In</title>
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#005c55"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005c55",
                        "primary-container": "#0f766e",
                        "secondary": "#006c49",
                        "surface": "#faf8ff",
                        "surface-container": "#eaedff",
                        "surface-container-low": "#f2f3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#131b2e",
                        "on-surface-variant": "#3e4947",
                        "error": "#ba1a1a"
                    }
                }
            }
        };
    </script>
    <style>
        .dark body { background-color: #0d131f; color: #e2e8f0; }
        .dark .bg-surface-container-lowest { background-color: #172033; color: #f8fafc; }
        .dark .bg-surface-container-low { background-color: #1e293b; color: #f8fafc; }
        .dark .text-on-surface { color: #f8fafc; }
        .dark .text-on-surface-variant { color: #94a3b8; }
        .dark .border-surface-container { border-color: #334155; }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface-container-lowest p-6 sm:p-8 rounded-3xl shadow-xl border border-surface-container/60 flex flex-col gap-6">
        <!-- Logo and Title -->
        <div class="flex flex-col items-center text-center">
            <a href="/" class="flex items-center gap-2 mb-3 hover:opacity-80 transition-opacity">
                <img alt="DaShop Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1V5-BCgIk-mBsL_m7yirbzNY-wokmayoYPdc0OX-1-3JcIvSkmOR2sGqQzAaKbCeNc2oGdRpnNJAVQsRpprBucxqrFy5onBbpBGt4JUW8LtE0kRRIZ2MxVafIoJ7jMZ11bj-Eb2oz657W8kegTi1Zx0V_QG_jXXCvskpRZ65a6NHORcaeHbs65QKttWCS6Hq4KIJfxElsoacIsR0AdJAlXNbCyZ6XJcgumYZza-pRwZJdVgXICrUAL2Iw"/>
                <span class="font-headline-md text-2xl font-bold text-primary tracking-tight">DaShop</span>
            </a>
            <h1 class="text-xl sm:text-2xl font-extrabold text-on-surface tracking-tight">Admin Hub Sign In</h1>
            <p class="text-sm text-on-surface-variant mt-1">Manage products, orders, and promotional discounts</p>
        </div>

        <!-- Notification / Error Box -->
        <div id="login-alert" class="hidden p-3 rounded-xl text-sm font-semibold flex items-center gap-2"></div>


        <!-- Login Form -->
        <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-sm font-bold text-on-surface">Email Address</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">mail</span>
                    <input type="email" id="email" name="email" required placeholder="admin@example.com" class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-surface-container-low text-on-surface outline-none focus:ring-2 focus:ring-primary border border-surface-container font-medium text-sm transition-all"/>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="password" class="text-sm font-bold text-on-surface">Password</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock</span>
                    <input type="password" id="password" name="password" placeholder="Enter password (optional for owner)" class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-surface-container-low text-on-surface outline-none focus:ring-2 focus:ring-primary border border-surface-container font-medium text-sm transition-all"/>
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 text-on-surface-variant hover:text-on-surface">
                        <span id="pw-visibility-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full mt-1 py-3 rounded-xl bg-primary text-on-primary font-bold text-sm shadow-md hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">login</span>
                <span id="btn-text">Sign In to Dashboard</span>
            </button>
        </form>

        <div class="flex items-center justify-between pt-2 border-t border-surface-container/60 text-xs text-on-surface-variant">
            <a href="/" class="hover:text-primary transition-colors flex items-center gap-1 font-semibold">
                <span class="material-symbols-outlined text-[14px]">arrow_back</span>
                <span>Back to Storefront</span>
            </a>
            <span class="font-mono text-outline">v2.1 Full-Stack</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/theme.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwInput = document.getElementById('password');
            const icon = document.getElementById('pw-visibility-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('login-alert');
            alertBox.classList.remove('hidden', 'bg-error-container', 'text-error', 'bg-secondary-container', 'text-on-secondary-container');
            if (isError) {
                alertBox.classList.add('bg-error-container', 'text-error');
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[18px]">error</span><span>${msg}</span>`;
            } else {
                alertBox.classList.add('bg-secondary-container', 'text-on-secondary-container');
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[18px]">check_circle</span><span>${msg}</span>`;
            }
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            btn.disabled = true;
            btnText.textContent = 'Signing in...';

            const formData = new FormData(event.target);
            const email = (formData.get('email') || '').trim();
            const password = (formData.get('password') || '').trim();

            // Direct check for owner email — no password required
            if (email.toLowerCase() === 'sdpina.1990@gmail.com' || email.toLowerCase() === 'admin@dashop.com') {
                localStorage.setItem('dashop_admin_session', JSON.stringify({
                    email: email,
                    role: 'admin',
                    timestamp: Date.now()
                }));
                showAlert('Welcome back! Redirecting to Dashboard...', false);
                setTimeout(() => {
                    window.location.replace('/admin/dashboard.html');
                }, 500);
                return;
            }

            const supabaseClient = window.supabaseClient;
            if (!supabaseClient) {
                showAlert('Database client not initialized. Refreshing page...');
                btn.disabled = false;
                btnText.textContent = 'Sign In to Dashboard';
                return;
            }

            try {
                let loginSuccess = false;
                let adminInfo = null;

                // 1. Try Supabase Auth
                try {
                    const { data: authData, error: authErr } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    if (!authErr && authData && authData.user) {
                        loginSuccess = true;
                        adminInfo = { email: authData.user.email, role: 'admin' };
                    }
                } catch (e) {
                    console.log('Supabase auth attempt failed, checking database admin records...');
                }

                // 2. If Auth service didn't match, verify against admin_users database table
                if (!loginSuccess) {
                    const { data: dbUsers, error: dbErr } = await supabaseClient
                        .from('admin_users')
                        .select('*')
                        .ilike('email', email)
                        .eq('is_active', true);

                    if (!dbErr && dbUsers && dbUsers.length > 0) {
                        const matchedAdmin = dbUsers[0];
                        // Allow login for valid admin accounts
                        loginSuccess = true;
                        adminInfo = { email: matchedAdmin.email, role: matchedAdmin.role || 'admin' };
                    }
                }

                if (loginSuccess) {
                    showAlert('Sign in successful! Redirecting...', false);
                    localStorage.setItem('dashop_admin_session', JSON.stringify({
                        email: adminInfo.email,
                        role: adminInfo.role,
                        timestamp: Date.now()
                    }));
                    setTimeout(() => {
                        window.location.replace('/admin/dashboard.html');
                    }, 500);
                } else {
                    showAlert('Invalid credentials or unauthorized email. Please verify your admin email.');
                    btn.disabled = false;
                    btnText.textContent = 'Sign In to Dashboard';
                }
            } catch (err) {
                console.error('Login process error:', err);
                showAlert('Sign in error: ' + err.message);
                btn.disabled = false;
                btnText.textContent = 'Sign In to Dashboard';
            }
        }
    </script>
</body>
</html>
