<!-- DaShop Admin - Orders Management -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta content="mobile_tab" name="shell-type"/>
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#005c55"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-dim": "#d2d9f4",
                        "inverse-primary": "#80d5cb",
                        "tertiary-fixed": "#acf847",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#a3faef",
                        "on-background": "#131b2e",
                        "surface-container-high": "#e2e7ff",
                        "on-surface": "#131b2e",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-variant": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eef0ff",
                        "secondary": "#006c49",
                        "primary-fixed": "#9cf2e8",
                        "on-primary-fixed": "#00201d",
                        "surface-bright": "#faf8ff",
                        "on-primary": "#ffffff",
                        "tertiary": "#375b00",
                        "surface": "#faf8ff",
                        "primary-container": "#0f766e",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eaedff",
                        "inverse-surface": "#283044",
                        "outline": "#6e7977",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3e4947",
                        "background": "#faf8ff",
                        "secondary-container": "#6cf8bb",
                        "primary": "#005c55",
                        "surface-container-low": "#f2f3ff"
                    },
                    spacing: {
                        "space-xs": "0.25rem",
                        "space-sm": "0.5rem",
                        "space-md": "0.75rem",
                        "space-base": "1rem",
                        "space-lg": "1.5rem",
                        "space-xl": "2rem",
                        "margin": "1rem",
                        "gutter": "0.75rem"
                    }
                }
            }
        };
    </script>
    <style>
        .dark body { background-color: #0d131f; color: #e2e8f0; }
        .dark .bg-surface { background-color: #0d131f; }
        .dark .bg-surface-container-lowest { background-color: #172033; color: #f8fafc; }
        .dark .bg-surface-container-low { background-color: #1e293b; }
        .dark .bg-surface-container { background-color: #27354f; }
        .dark .bg-surface-container-high { background-color: #334155; }
        .dark .text-on-surface { color: #f8fafc; }
        .dark .text-on-surface-variant { color: #94a3b8; }
        .dark .border-surface-container { border-color: #334155; }
    </style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="h-16 px-margin flex items-center justify-between gap-space-sm max-w-7xl mx-auto w-full">
            <a href="/" class="flex items-center gap-space-sm min-w-0 cursor-pointer hover:opacity-80 active:scale-95 transition-all">
                <img alt="DaShop Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1V5-BCgIk-mBsL_m7yirbzNY-wokmayoYPdc0OX-1-3JcIvSkmOR2sGqQzAaKbCeNc2oGdRpnNJAVQsRpprBucxqrFy5onBbpBGt4JUW8LtE0kRRIZ2MxVafIoJ7jMZ11bj-Eb2oz657W8kegTi1Zx0V_QG_jXXCvskpRZ65a6NHORcaeHbs65QKttWCS6Hq4KIJfxElsoacIsR0AdJAlXNbCyZ6XJcgumYZza-pRwZJdVgXICrUAL2Iw"/>
                <div class="flex flex-col min-w-0">
                    <span class="font-headline-md text-headline-md text-primary font-bold tracking-tight leading-none">DaShop</span>
                    <span class="font-label-sm text-label-sm text-on-surface-variant truncate uppercase tracking-wider" data-i18n="orders">Orders</span>
                </div>
            </a>
            
            <div class="flex items-center gap-2">
                <!-- Admin User Badge -->
                <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container/40 text-on-secondary-container text-xs font-bold border border-secondary/20">
                    <span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
                    <span id="admin-user-email">sdpina.1990@gmail.com</span>
                </div>

                <!-- Interactive Language Switcher -->
                <div class="relative">
                    <button type="button" onclick="toggleLangMenu(event)" class="px-2.5 py-1.5 rounded-full bg-surface-container-low text-xs font-bold flex items-center gap-1 text-on-surface hover:bg-surface-container active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[16px]">translate</span>
                        <span id="current-lang-text">EN</span>
                    </button>
                    <div id="lang-dropdown" class="absolute right-0 top-full mt-1 w-32 bg-surface-container-lowest rounded-xl shadow-xl border border-surface-container py-1 hidden z-50">
                        <button onclick="selectLanguage('en')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇺🇸</span> English</button>
                        <button onclick="selectLanguage('es')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇪🇸</span> Español</button>
                        <button onclick="selectLanguage('pt')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇧🇷</span> Português</button>
                    </div>
                </div>

                <!-- Dark Mode Toggle -->
                <button type="button" onclick="window.themeManager.toggle()" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-low active:scale-90 transition-all" title="Toggle theme">
                    <span class="material-symbols-outlined text-[20px] theme-toggle-icon">dark_mode</span>
                </button>

                <!-- Sign Out Button -->
                <button type="button" onclick="handleAdminSignOut()" class="px-3 py-1.5 rounded-full bg-error-container/40 text-error hover:bg-error-container text-xs font-bold flex items-center gap-1 transition-all active:scale-95" title="Sign Out">
                    <span class="material-symbols-outlined text-[16px]">logout</span>
                    <span>Exit</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pt-16 pb-28 bg-surface max-w-7xl mx-auto">
        <div class="flex flex-col w-full px-margin pb-space-xl">
            <!-- Header Intro -->
            <section class="mt-space-sm mb-space-base">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight" data-i18n="orders">All Orders</h1>
                        <p class="font-body-sm text-body-sm text-on-surface-variant mt-space-2xs">Live management, status updating, and order processing</p>
                    </div>
                    <div class="flex items-center gap-space-2xs bg-surface-container px-space-sm py-space-xs rounded-full">
                        <span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
                        <span class="font-label-sm text-label-sm text-secondary font-bold uppercase tracking-wider">Live Sync</span>
                    </div>
                </div>
            </section>

            <!-- Search & Quick Filters -->
            <section class="mb-space-md flex flex-col gap-space-sm">
                <!-- Search Bar -->
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-[20px]">search</span>
                    </span>
                    <input class="w-full pl-10 pr-10 py-2.5 rounded-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-sm text-body-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-primary border border-surface-container/60" id="order-search" placeholder="Search by customer name, email, or order ID..." type="text"/>
                    <button aria-label="Clear search" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface" onclick="document.getElementById('order-search').value = ''; filterOrdersLocally();">
                        <span class="material-symbols-outlined text-[18px]">cancel</span>
                    </button>
                </div>

                <!-- Filter Chips -->
                <div class="flex items-center gap-space-xs overflow-x-auto no-scrollbar py-space-2xs">
                    <button onclick="setOrderStatusFilter('all', this)" class="order-filter-tab px-4 py-1.5 rounded-full bg-primary text-on-primary font-label-md font-bold shadow-sm transition-all">
                        <span>All</span>
                    </button>
                    <button onclick="setOrderStatusFilter('pending', this)" class="order-filter-tab px-4 py-1.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md font-bold shadow-sm transition-all hover:bg-surface-container-low">
                        <span data-i18n="status_pending">Pending</span>
                    </button>
                    <button onclick="setOrderStatusFilter('completed', this)" class="order-filter-tab px-4 py-1.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md font-bold shadow-sm transition-all hover:bg-surface-container-low">
                        <span data-i18n="status_completed">Completed</span>
                    </button>
                </div>
            </section>

            <!-- Orders Interactive Feed -->
            <section class="flex flex-col gap-space-sm" id="orders-container-dynamic">
                <div class="p-8 text-center text-on-surface-variant">Loading orders...</div>
            </section>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full z-50 pb-safe pointer-events-auto">
        <div class="px-margin pb-space-sm pt-space-xs">
            <div class="h-16 max-w-md mx-auto w-full rounded-full bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_4px_24px_rgba(15,23,42,0.08)] flex items-center justify-around px-space-xs border border-surface-container/50">
                <a class="flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface active:scale-90 transition-all" href="/">
                    <span class="material-symbols-outlined text-[22px]">storefront</span>
                    <span class="font-label-sm text-label-sm" data-i18n="store">Store</span>
                </a>
                <a class="flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface active:scale-90 transition-all" href="/catalog.html">
                    <span class="material-symbols-outlined text-[22px]">grid_view</span>
                    <span class="font-label-sm text-label-sm" data-i18n="catalog">Catalog</span>
                </a>
                <a aria-current="page" class="flex-1 flex flex-col items-center justify-center h-12 rounded-full transition-all active:scale-90 text-primary font-semibold" href="/admin/orders.html">
                    <span class="material-symbols-outlined text-[22px]">receipt_long</span>
                    <span class="font-label-sm text-label-sm" data-i18n="orders">Orders</span>
                </a>
                <a class="flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface active:scale-90 transition-all" href="/admin/dashboard.html">
                    <span class="material-symbols-outlined text-[22px]">dashboard</span>
                    <span class="font-label-sm text-label-sm" data-i18n="admin_hub">Admin Hub</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/promos.js"></script>
    <script src="/admin/js/admin.js"></script>
    <script>
        let currentFilterStatus = 'all';

        function setOrderStatusFilter(status, btn) {
            currentFilterStatus = status;
            document.querySelectorAll('.order-filter-tab').forEach(b => {
                b.classList.remove('bg-primary', 'text-on-primary');
                b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
            });
            if (btn) {
                btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
                btn.classList.add('bg-primary', 'text-on-primary');
            }
            filterOrdersLocally();
        }

        function filterOrdersLocally() {
            const searchVal = (document.getElementById('order-search')?.value || '').toLowerCase();
            const cards = document.querySelectorAll('.order-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                const matchesSearch = !searchVal || text.includes(searchVal);
                let matchesStatus = true;
                if (currentFilterStatus === 'pending') {
                    matchesStatus = text.includes('pending');
                } else if (currentFilterStatus === 'completed') {
                    matchesStatus = text.includes('completed');
                }
                
                card.style.display = (matchesSearch && matchesStatus) ? 'block' : 'none';
            });
        }

        document.getElementById('order-search')?.addEventListener('input', filterOrdersLocally);
    </script>
</body>
</html>
