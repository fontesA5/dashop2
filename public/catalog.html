<!-- Cart Modal -->

<!-- Checkout Modal -->
<div id="checkout-modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeCheckout()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-space-md pointer-events-none">

                </button>
            </div>
            <form id="checkout-form" onsubmit="handleCheckout(event)" class="p-space-md flex flex-col gap-space-md">

                </div>
                <div class="flex flex-col gap-1">

                </div>
                <div class="flex flex-col gap-1">
                    <label for="address" class="font-label-md text-on-surface">Address</label>

                </div>

                    Place Order

    </div>
