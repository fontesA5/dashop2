<!-- DaShop - Product Catalog -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta content="mobile_tab" name="shell-type"/>
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#005c55"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-dim": "#d2d9f4",
                        "inverse-primary": "#80d5cb",
                        "tertiary-fixed": "#acf847",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#a3faef",
                        "on-background": "#131b2e",
                        "surface-container-high": "#e2e7ff",
                        "on-surface": "#131b2e",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-variant": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eef0ff",
                        "secondary": "#006c49",
                        "primary-fixed": "#9cf2e8",
                        "on-primary-fixed": "#00201d",
                        "surface-bright": "#faf8ff",
                        "on-primary": "#ffffff",
                        "tertiary": "#375b00",
                        "surface": "#faf8ff",
                        "primary-container": "#0f766e",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eaedff",
                        "inverse-surface": "#283044",
                        "outline": "#6e7977",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3e4947",
                        "background": "#faf8ff",
                        "secondary-container": "#6cf8bb",
                        "primary": "#005c55",
                        "surface-container-low": "#f2f3ff"
                    },
                    spacing: {
                        "space-xs": "0.25rem",
                        "space-sm": "0.5rem",
                        "space-md": "0.75rem",
                        "space-base": "1rem",
                        "space-lg": "1.5rem",
                        "space-xl": "2rem",
                        "margin": "1rem",
                        "gutter": "0.75rem"
                    }
                }
            }
        };
    </script>
    <style>
        .dark body { background-color: #0d131f; color: #e2e8f0; }
        .dark .bg-surface { background-color: #0d131f; }
        .dark .bg-surface-container-lowest { background-color: #172033; color: #f8fafc; }
        .dark .bg-surface-container-low { background-color: #1e293b; }
        .dark .bg-surface-container { background-color: #27354f; }
        .dark .bg-surface-container-high { background-color: #334155; }
        .dark .text-on-surface { color: #f8fafc; }
        .dark .text-on-surface-variant { color: #94a3b8; }
        .dark .border-surface-container { border-color: #334155; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="h-16 px-margin flex items-center justify-between gap-space-sm max-w-7xl mx-auto w-full">
            <a href="/" class="flex items-center gap-space-sm min-w-0 cursor-pointer hover:opacity-80 active:scale-95 transition-all">
                <img alt="DaShop Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1V5-BCgIk-mBsL_m7yirbzNY-wokmayoYPdc0OX-1-3JcIvSkmOR2sGqQzAaKbCeNc2oGdRpnNJAVQsRpprBucxqrFy5onBbpBGt4JUW8LtE0kRRIZ2MxVafIoJ7jMZ11bj-Eb2oz657W8kegTi1Zx0V_QG_jXXCvskpRZ65a6NHORcaeHbs65QKttWCS6Hq4KIJfxElsoacIsR0AdJAlXNbCyZ6XJcgumYZza-pRwZJdVgXICrUAL2Iw"/>
                <div class="flex flex-col min-w-0">
                    <span class="font-headline-md text-headline-md text-primary font-bold tracking-tight leading-none">DaShop</span>
                    <span class="font-label-sm text-label-sm text-on-surface-variant truncate uppercase tracking-wider" data-i18n="catalog">Catalog</span>
                </div>
            </a>
            
            <div class="flex items-center gap-2">
                <!-- Interactive Language Switcher -->
                <div class="relative">
                    <button type="button" onclick="toggleLangMenu(event)" class="px-2.5 py-1.5 rounded-full bg-surface-container-low text-xs font-bold flex items-center gap-1 text-on-surface hover:bg-surface-container active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[16px]">translate</span>
                        <span id="current-lang-text">EN</span>
                    </button>
                    <div id="lang-dropdown" class="absolute right-0 top-full mt-1 w-32 bg-surface-container-lowest rounded-xl shadow-xl border border-surface-container py-1 hidden z-50">
                        <button onclick="selectLanguage('en')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇺🇸</span> English</button>
                        <button onclick="selectLanguage('es')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇪🇸</span> Español</button>
                        <button onclick="selectLanguage('pt')" class="w-full text-left px-3 py-2 text-xs font-semibold hover:bg-surface-container-low flex items-center gap-2"><span>🇧🇷</span> Português</button>
                    </div>
                </div>

                <!-- Dark Mode Toggle Button -->
                <button type="button" onclick="window.themeManager.toggle()" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-low active:scale-90 transition-all" title="Toggle theme">
                    <span class="material-symbols-outlined text-[20px] theme-toggle-icon">dark_mode</span>
                </button>

                <!-- Cart Button -->
                <button aria-label="Shopping Cart" class="relative w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-low active:scale-90 transition-all" onclick="openCart()">
                    <span class="material-symbols-outlined text-[22px]">shopping_bag</span>
                    <span id="cart-count" class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pt-20 pb-28 bg-surface max-w-7xl mx-auto">
        <div class="flex flex-col w-full px-margin pb-20">
            <!-- Search Field with Autocomplete -->
            <div class="pt-space-sm pb-space-xs">
                <div class="relative flex items-center w-full bg-surface-container-low rounded-full px-space-base py-space-sm shadow-sm border border-surface-container/60">
                    <span class="material-symbols-outlined text-outline text-[22px] mr-space-xs select-none">search</span>
                    <input aria-label="Search essentials" class="w-full bg-transparent text-on-surface placeholder:text-outline font-body-md focus:outline-none" id="catalog-search" placeholder="Search products by name or category..." data-i18n-placeholder="search_catalog_placeholder" type="search">
                    <button aria-label="Clear search" class="text-outline hover:text-primary transition-colors flex items-center justify-center p-space-2xs" onclick="document.getElementById('catalog-search').value = ''; loadProducts();">
                        <span class="material-symbols-outlined text-[18px]">cancel</span>
                    </button>
                    <!-- Autocomplete dropdown rendered here by app.js -->
                    <div id="catalog-search-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-surface-container-lowest rounded-xl shadow-xl border border-surface-container overflow-hidden z-50 hidden"></div>
                </div>
            </div>

            <!-- Dynamic Category Chips (Original Categories) -->
            <div id="catalog-category-chips" class="py-space-xs -mx-margin px-margin overflow-x-auto no-scrollbar flex items-center gap-space-xs">
                <button onclick="filterByCategory('All', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-primary text-on-primary shadow-sm active:scale-95" data-category="All">
                    <span class="material-symbols-outlined text-[16px]">apps</span>
                    <span>All</span>
                </button>
                <button onclick="filterByCategory('Household Essentials', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95" data-category="Household Essentials">
                    <span class="material-symbols-outlined text-[16px]">cleaning_services</span>
                    <span>Household Essentials</span>
                </button>
                <button onclick="filterByCategory('Personal Care', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95" data-category="Personal Care">
                    <span class="material-symbols-outlined text-[16px]">sanitizer</span>
                    <span>Personal Care</span>
                </button>
                <button onclick="filterByCategory('Beauty', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95" data-category="Beauty">
                    <span class="material-symbols-outlined text-[16px]">face</span>
                    <span>Beauty</span>
                </button>
                <button onclick="filterByCategory('Health & Care', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95" data-category="Health & Care">
                    <span class="material-symbols-outlined text-[16px]">health_and_safety</span>
                    <span>Health & Care</span>
                </button>
                <button onclick="filterByCategory('Flash Deals', this)" class="category-chip shrink-0 px-space-base py-space-xs rounded-full font-label-md text-label-md flex items-center gap-1.5 transition-all bg-error-container text-on-error-container hover:bg-error-container/80 active:scale-95 font-bold" data-category="Flash Deals">
                    <span class="material-symbols-outlined text-[16px]">bolt</span>
                    <span>Flash Deals</span>
                </button>
            </div>

            <!-- Product Grid -->
            <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-gutter pt-space-md">
                <div class="col-span-full p-8 text-center text-on-surface-variant font-medium">Loading live catalog...</div>
            </div>
        </div>
    </main>

    <!-- Reliable Bottom Navigation Dock for Customers (No Admin Hub exposed) -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 pb-safe px-margin pb-3 pointer-events-auto">
        <div class="h-16 max-w-md mx-auto w-full rounded-full bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_4px_24px_rgba(15,23,42,0.15)] flex items-center justify-around px-space-xs border border-surface-container/60">
            <a class="flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface transition-all active:scale-90" href="/">
                <span class="material-symbols-outlined text-[22px]">storefront</span>
                <span class="font-label-sm text-label-sm" data-i18n="store">Store</span>
            </a>
            <a aria-current="page" class="flex-1 flex flex-col items-center justify-center h-12 rounded-full transition-all text-primary font-bold active:scale-90" href="/catalog.html">
                <span class="material-symbols-outlined text-[22px]">grid_view</span>
                <span class="font-label-sm text-label-sm" data-i18n="catalog">Catalog</span>
            </a>
            <button type="button" onclick="openCart()" class="relative flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface transition-all active:scale-90">
                <span class="material-symbols-outlined text-[22px]">shopping_bag</span>
                <span class="font-label-sm text-label-sm" data-i18n="cart">Cart</span>
                <span id="dock-cart-badge" class="absolute top-1.5 right-4 min-w-[16px] h-[16px] px-1 rounded-full bg-primary text-on-primary text-[10px] font-bold flex items-center justify-center hidden">0</span>
            </button>
            <button type="button" onclick="openCustomerOrdersModal()" class="flex-1 flex flex-col items-center justify-center h-12 rounded-full text-on-surface-variant hover:text-on-surface transition-all active:scale-90">
                <span class="material-symbols-outlined text-[22px]">receipt_long</span>
                <span class="font-label-sm text-label-sm" data-i18n="orders">Orders</span>
            </button>
        </div>
    </nav>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeCart()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-surface-container-lowest shadow-2xl flex flex-col">
            <div class="flex items-center justify-between p-space-md border-b border-surface-container">
                <h2 class="font-headline-md text-on-surface font-bold" data-i18n="cart">Your Cart</h2>
                <button onclick="closeCart()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-space-md flex flex-col gap-space-sm"></div>
            <div class="p-space-md border-t border-surface-container bg-surface-container-lowest">
                <div class="flex justify-between items-center mb-space-md font-title-md font-bold">
                    <span data-i18n="total">Total:</span>
                    <span>$<span id="cart-total">0.00</span></span>
                </div>
                <button onclick="proceedToCheckout()" class="w-full py-3 rounded-full bg-primary text-on-primary font-label-lg font-bold shadow-md hover:bg-primary-container transition-colors" data-i18n="proceed_to_checkout">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal with Discount Code & Customer Details -->
    <div id="checkout-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeCheckout()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-space-md pointer-events-none">
            <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-2xl flex flex-col pointer-events-auto max-h-[90vh] overflow-hidden">
                <div class="flex items-center justify-between p-space-md border-b border-surface-container">
                    <h2 class="font-headline-md text-on-surface font-bold" data-i18n="checkout">Checkout</h2>
                    <button onclick="closeCheckout()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <form id="checkout-form" onsubmit="handleCheckout(event)" class="p-space-md flex flex-col gap-space-sm overflow-y-auto">
                    <div class="flex flex-col gap-1">
                        <label class="font-label-md text-on-surface font-semibold" data-i18n="full_name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe" class="px-3 py-2 rounded-xl bg-surface-container-low text-on-surface outline-none focus:ring-2 focus:ring-primary border border-surface-container">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="font-label-md text-on-surface font-semibold" data-i18n="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com" class="px-3 py-2 rounded-xl bg-surface-container-low text-on-surface outline-none focus:ring-2 focus:ring-primary border border-surface-container">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="font-label-md text-on-surface font-semibold" data-i18n="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 000-0000" class="px-3 py-2 rounded-xl bg-surface-container-low text-on-surface outline-none focus:ring-2 focus:ring-primary border border-surface-container">
                    </div>

                    <!-- Discount Code Section -->
                    <div class="flex flex-col gap-1 pt-1">
                        <label class="font-label-md text-on-surface font-semibold" data-i18n="discount_code">Promo / Discount Code</label>
                        <div class="flex gap-2">
                            <input type="text" id="promo-code-input" placeholder="e.g. SAVE10" class="flex-1 px-3 py-2 rounded-xl bg-surface-container-low text-on-surface uppercase font-bold text-sm outline-none border border-surface-container">
                            <button type="button" onclick="applyPromoCode()" class="px-4 py-2 bg-secondary text-on-secondary font-bold text-sm rounded-xl hover:bg-secondary-container transition-colors" data-i18n="apply">Apply</button>
                        </div>
                        <span id="promo-code-msg"></span>
                    </div>

                    <!-- Order Summary in Checkout -->
                    <div id="checkout-summary" class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-1 mt-1"></div>

                    <button type="submit" class="w-full mt-2 py-3 rounded-full bg-primary text-on-primary font-label-lg font-bold shadow-md hover:bg-primary-container transition-colors" data-i18n="place_order">
                        Place Order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Customer Orders & Live Tracking Modal -->
    <div id="customer-orders-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeCustomerOrdersModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-space-md pointer-events-none">
            <div class="w-full max-w-md bg-surface-container-lowest rounded-3xl shadow-2xl flex flex-col pointer-events-auto max-h-[85vh] overflow-hidden">
                <div class="flex items-center justify-between p-4 border-b border-surface-container">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-[24px]">receipt_long</span>
                        <h2 class="font-headline-md font-bold text-on-surface" data-i18n="orders">My Orders</h2>
                    </div>
                    <button onclick="closeCustomerOrdersModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-4 overflow-y-auto flex flex-col gap-4">
                    <!-- Track by ID/Email -->
                    <div class="p-3 rounded-2xl bg-surface-container-low flex flex-col gap-2">
                        <span class="text-xs font-bold text-on-surface uppercase tracking-wider">Track Any Order</span>
                        <div class="flex gap-2">
                            <input type="text" id="order-track-input" placeholder="Enter Order ID or Email..." class="flex-1 px-3 py-2 rounded-xl bg-surface-container-lowest text-on-surface text-sm outline-none border border-surface-container font-medium"/>
                            <button onclick="searchCustomerOrder()" class="px-4 py-2 bg-primary text-on-primary text-xs font-bold rounded-xl hover:bg-primary-container transition-all active:scale-95">Track</button>
                        </div>
                        <div id="order-search-result" class="text-xs mt-1"></div>
                    </div>

                    <!-- Local Orders List -->
                    <div class="flex flex-col gap-2">
                        <span class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Recent Orders (This Device)</span>
                        <div id="customer-orders-list" class="flex flex-col gap-2">
                            <div class="p-4 text-center text-xs text-on-surface-variant">No orders placed on this device yet.</div>
                        </div>
                    </div>

                    <!-- Admin link if session exists -->
                    <div id="admin-orders-link-wrapper" class="pt-2 border-t border-surface-container/60 text-center hidden">
                        <a href="/admin/orders.html" class="text-xs font-bold text-primary hover:underline flex items-center justify-center gap-1">
                            <span>Open Merchant Orders Management</span>
                            <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/promos.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function toggleLangMenu(e) {
            e.stopPropagation();
            const dd = document.getElementById('lang-dropdown');
            if (dd) dd.classList.toggle('hidden');
        }

        function selectLanguage(lang) {
            if (window.i18n) window.i18n.setLanguage(lang);
            document.getElementById('lang-dropdown')?.classList.add('hidden');
        }

        document.addEventListener('click', () => {
            document.getElementById('lang-dropdown')?.classList.add('hidden');
        });
    </script>
</body>
</html>
